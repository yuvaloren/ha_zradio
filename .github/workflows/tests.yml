name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck python3-yaml openssh-client ser2net socat keepalived
      - name: shellcheck
        run: shellcheck -S warning get.sh install.sh guest/install.sh tests/*.sh
      - name: the tests (fakes only, no hardware)
        run: bash tests/run.sh
      - name: nothing generated outside gen/ (a test run leaves the tree as git has it)
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: the tests' copies of Home Assistant's USB lists are the lists at the pinned commit
        run: |
          python3 guest/lib/zradio-usb-ids.py --out /tmp/from-github.json
          ZRADIO_USB_IDS_SOURCE=tests/fixtures/ha-core python3 guest/lib/zradio-usb-ids.py --out /tmp/from-fixtures.json
          cmp /tmp/from-github.json /tmp/from-fixtures.json
