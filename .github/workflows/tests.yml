name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # pinned to a commit, with the release it is in the comment: Dependabot moves both (.github/dependabot.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false      # the steps below run the repository's own scripts: no token is left for them
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck python3-yaml openssh-client ser2net socat keepalived jq
      - name: shellcheck
        run: bash tests/shellcheck.sh
      - name: the tests (fakes only, no hardware)
        run: bash tests/run.sh
      - name: the third vote's installer under the oldest bash it promises (docker; bash 3.2 and 4.4)
        run: bash tests/vote-bash.sh
      - name: the third vote's container, with the real programs (docker)
        run: bash tests/vote-real.sh
      - name: Home Assistant's side, on its terminal's kind of machine (docker; Alpine and busybox, no python)
        run: bash tests/hass-real.sh
      - name: nothing generated outside gen/ (a test run leaves the tree as git has it)
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: the tests' copies of Home Assistant's USB lists are the lists at the pinned commit
        run: |
          python3 guest/lib/zradio-usb-ids.py --out /tmp/from-github.json
          ZRADIO_USB_IDS_SOURCE=tests/fixtures/ha-core python3 guest/lib/zradio-usb-ids.py --out /tmp/from-fixtures.json
          cmp /tmp/from-github.json /tmp/from-fixtures.json
