name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck python3-yaml openssh-client
      - name: shellcheck
        run: shellcheck -S warning install.sh guest/install.sh tests/*.sh
      - name: the tests (fakes only, no hardware)
        run: bash tests/run.sh
