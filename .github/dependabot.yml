# Keeps the GitHub Actions the workflows use on their current releases, with one pull request a month that the tests
# gate. An action left on an old major is how the workflow came to run on a deprecated Node.js.
# Not watched here, on purpose: the Debian release of tests/Dockerfile and of the vote's image (vote/install.sh). They
# follow the Debian release Proxmox is built on, and change with it.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
